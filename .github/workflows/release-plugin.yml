name: Release plugin

# Builds one <plugin>.plugin per adapters/* folder (all must share one version) and attaches them to the GitHub release.
# One-click download: https://github.com/syncwin/lifeos-ai/releases/latest/download/lifeos.plugin
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-plugin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and attach the plugin packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NAME: "LifeOS"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the package
        id: build
        run: |
          python3 - <<'PY'
          import json, os, zipfile
          import glob
          skip_dirs = {".git", ".github", ".claude", "tests", "node_modules", "__pycache__", "evals", "prompts", "dist"}
          skip_files = {"IMPROVEMENTS.md", ".public-safety-allow"}
          text_ext = {".md", ".json", ".yaml", ".yml", ".txt"}
          text_names = {"LICENSE", ".gitignore"}
          os.makedirs("dist", exist_ok=True)
          versions = set()
          for root in sorted(glob.glob("adapters/*/")):
              meta = json.load(open(os.path.join(root, ".claude-plugin", "plugin.json"), encoding="utf-8"))
              versions.add(meta["version"])
              out = os.path.join(os.getcwd(), "dist", meta["name"] + ".plugin")
              if os.path.exists(out):
                  os.remove(out)
              with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
                  for d, dirs, files in os.walk(root):
                      dirs[:] = sorted(x for x in dirs if x not in skip_dirs)
                      for f in sorted(files):
                          if f in skip_files or f.endswith(".pyc"):
                              continue
                          p = os.path.join(d, f)
                          z.write(p, os.path.relpath(p, root).replace(os.sep, "/"))
              with zipfile.ZipFile(out) as z:
                  names = z.namelist()
                  assert ".claude-plugin/plugin.json" in names, "plugin.json missing at zip root: " + out
                  bad = [n for n in names if os.path.splitext(n)[1].lower() not in text_ext and os.path.basename(n) not in text_names]
                  assert not bad, "non-text files must not ship: " + ", ".join(bad)
                  assert not [n for n in names if n.split("/")[0] in ("hooks", "scripts")], "hooks and scripts must not ship"
              print("built", out)
          assert len(versions) == 1, "plugins must share one version: " + ", ".join(sorted(versions))
          version = versions.pop()
          with open(os.environ.get("GITHUB_OUTPUT", os.devnull), "a") as g:
              g.write("version=" + version + "\n")
          print("version", version)
          PY
      - name: Check the tag matches the plugin version
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.build.outputs.version }}
        run: test "$GITHUB_REF_NAME" = "v$VERSION" || { echo "tag $GITHUB_REF_NAME does not match plugin version $VERSION"; exit 1; }
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.plugin --clobber
          else
            gh release create "$tag" dist/*.plugin --title "$NAME $tag" --generate-notes --target "$GITHUB_SHA"
          fi
